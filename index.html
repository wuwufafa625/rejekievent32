<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard Doorprize - Gebyar Nikorama</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        /* Gaya Dasar */
        body {
            font-family: 'Poppins', sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Container Utama */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Banner Animasi Video */
        .video-banner {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            display: block;
        }

        /* Header (Judul & Jam) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header h2 {
            margin: 0;
            color: #4f46e5;
            font-weight: 700;
        }

        #jam {
            font-weight: 600;
            background: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            color: #4f46e5;
        }

        /* Kartu Informasi */
        .cards-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 150px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card b {
            font-size: 1.5em;
            display: block;
            margin-top: 5px;
        }

        /* Kolom Pencarian */
        input#cari {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input#cari:focus {
            outline: none;
            border-color: #4f46e5;
        }

        /* Responsivitas Tabel untuk Mobile */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            border-bottom: 1px solid #eee;
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background: #4f46e5;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        th:hover {
            background: #3730a3;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }
        
        tr:hover {
            background: #f1f5f9;
        }

        /* Penyesuaian khusus untuk Layar HP (Mobile) */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .video-banner {
                max-height: 200px; /* Banner lebih pendek di HP */
                border-radius: 10px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .cards-container {
                flex-direction: column;
            }
            .card {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Banner Animasi Video -->
    <!-- Menggunakan file coba_lagi.mp4 sesuai dengan nama file Anda -->
    <video class="video-banner" autoplay loop muted playsinline>
        <source src="coba_lagi.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>

    <!-- Bagian Header -->
    <div class="header">
        <h2>Dashboard Doorprize</h2>
        <div id="jam"></div>
    </div>

    <!-- Bagian Kartu Info -->
    <div class="cards-container">
        <div class="card">Total Data<br><b id="total">0</b></div>
        <div class="card">Update Terakhir<br><b id="upd">-</b></div>
    </div>

    <!-- Kolom Pencarian -->
    <input id="cari" placeholder="Cari nama atau nomor undian...">

    <!-- Tabel Data -->
    <div class="table-responsive">
        <table id="tbl"></table>
    </div>
</div>

<script>
const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiZU8-43r2k7yPouq8insGUTXURLnWxC8nOYYNJGLoCkGYLF3YXxrsgR93kRi7Jrnyo-wdenWm91vc/pub?gid=0&single=true&output=csv";
let master = [], sortAsc = true;

function render(data) {
    if (!data.length) {
        tbl.innerHTML = "<tr><td style='text-align:center; padding:20px;'>Tidak ada data ditemukan</td></tr>";
        return;
    }
    let h = "<thead><tr>";
    Object.keys(data[0]).forEach(k => h += `<th onclick="sortCol('${k}')">${k} &#8197; ↕</th>`);
    h += "</tr></thead><tbody>";
    data.forEach(r => {
        h += "<tr>";
        Object.values(r).forEach(v => h += `<td>${v ?? ""}</td>`);
        h += "</tr>";
    });
    h += "</tbody>";
    tbl.innerHTML = h;
    total.textContent = data.length;
    upd.textContent = new Date().toLocaleString("id-ID");
}

function sortCol(c) {
    master.sort((a, b) => sortAsc 
        ? String(a[c]).localeCompare(String(b[c]), 'id', {numeric: true}) 
        : String(b[c]).localeCompare(String(a[c]), 'id', {numeric: true})
    );
    sortAsc = !sortAsc;
    render(master);
}

function load() {
    Papa.parse(CSV, {
        download: true,
        skipEmptyLines: true,
        complete: r => {
            const rows = r.data;
            if (rows.length < 6) return; // Mencegah error jika data kosong
            const header = rows[5].slice(7, 13);
            master = [];
            for (let i = 6; i < rows.length; i++) {
                const cols = rows[i].slice(7, 13);
                if (cols.join("").trim() == "") continue;
                let o = {};
                header.forEach((x, j) => o[x] = cols[j] || "");
                master.push(o);
            }
            // Simpan filter pencarian saat load ulang
            const searchVal = document.getElementById('cari').value.toLowerCase();
            if (searchVal) {
                render(master.filter(x => Object.values(x).join(" ").toLowerCase().includes(searchVal)));
            } else {
                render(master);
            }
        }
    });
}

cari.oninput = () => {
    const val = cari.value.toLowerCase();
    render(master.filter(x => Object.values(x).join(" ").toLowerCase().includes(val)));
};

// Inisialisasi
load();
setInterval(load, 30000); // Auto-refresh data setiap 30 detik
setInterval(() => jam.textContent = new Date().toLocaleTimeString("id-ID"), 1000); // Jam berjalan
</script>

</body>
</html>
