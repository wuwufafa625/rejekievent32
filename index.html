<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Doorprize</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
body{font-family:Poppins,sans-serif;background:#eef2ff;margin:0;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center}
.card{background:#4f46e5;color:#fff;padding:15px;border-radius:10px;display:inline-block;margin:10px 10px 20px 0}
input{width:100%;padding:10px;margin:10px 0}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ddd;padding:8px}
th{background:#4f46e5;color:#fff;cursor:pointer}
tr:nth-child(even){background:#f7f7f7}
</style></head><body>
<div class="header"><h2>Dashboard Doorprize</h2><div id="jam"></div></div>
<div class="card">Total Data<br><b id="total">0</b></div>
<div class="card">Update<br><b id="upd">-</b></div>
<input id="cari" placeholder="Cari...">
<table id="tbl"></table>
<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRiZU8-43r2k7yPouq8insGUTXURLnWxC8nOYYNJGLoCkGYLF3YXxrsgR93kRi7Jrnyo-wdenWm91vc/pub?gid=0&single=true&output=csv";
let master=[],sortAsc=true;
function render(data){
 if(!data.length){tbl.innerHTML="<tr><td>Tidak ada data</td></tr>";return;}
 let h="<thead><tr>";
 Object.keys(data[0]).forEach(k=>h+=`<th onclick="sortCol('${k}')">${k}</th>`);
 h+="</tr></thead><tbody>";
 data.forEach(r=>{h+="<tr>";Object.values(r).forEach(v=>h+=`<td>${v??""}</td>`);h+="</tr>";});
 h+="</tbody>";tbl.innerHTML=h;
 total.textContent=data.length;
 upd.textContent=new Date().toLocaleString("id-ID");
}
function sortCol(c){
 master.sort((a,b)=>sortAsc?String(a[c]).localeCompare(String(b[c]),'id',{numeric:true}):String(b[c]).localeCompare(String(a[c]),'id',{numeric:true}));
 sortAsc=!sortAsc;render(master);
}
function load(){
 Papa.parse(CSV,{download:true,skipEmptyLines:true,complete:r=>{
   const rows=r.data;
   const header=rows[5].slice(7,13);
   master=[];
   for(let i=6;i<rows.length;i++){
      const cols=rows[i].slice(7,13);
      if(cols.join("").trim()=="") continue;
      let o={};header.forEach((x,j)=>o[x]=cols[j]||"");
      master.push(o);
   }
   render(master);
 }});
}
cari.oninput=()=>render(master.filter(x=>Object.values(x).join(" ").toLowerCase().includes(cari.value.toLowerCase())));
load();setInterval(load,30000);setInterval(()=>jam.textContent=new Date().toLocaleTimeString("id-ID"),1000);
</script></body></html>
