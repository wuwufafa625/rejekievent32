<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gebyar Hadiah Nikorama Ulang Tahun Ke-32</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg-primary: #0a0518;
    --bg-card: #150d2a;
    --accent-purple: #8b5cf6;
    --accent-gold: #f59e0b;
    --accent-gold-light: #fbbf24;
    --text-main: #f8fafc;
    --text-muted: #a78bfa;
    --border-color: rgba(139, 92, 246, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-main);
    min-height: 100vh;
    padding: 24px;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.12) 0%, transparent 45%);
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
  }

  /* --- BANNER VIDEO ANIMASI (BARU DITAMBAHKAN) --- */
  .video-banner {
    width: 100%;
    height: auto;
    max-height: 400px;
    object-fit: cover;
    border-radius: 20px;
    border: 1px solid rgba(245, 158, 11, 0.4);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(139, 92, 246, 0.15);
    margin-bottom: 28px;
    display: block;
  }

  /* --- BANNER TEXT & CLOCK --- */
  .hero-banner {
    background: linear-gradient(-45deg, #0d061e, #251249, #1b0938, #0d061e);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite; /* Animasi Gradasi Gerak */
    border: 1px solid rgba(245, 158, 11, 0.4);
    border-radius: 20px;
    padding: 36px 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(139, 92, 246, 0.15);
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }

  /* Keyframe Background Bergerak */
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Watermark / Logo 32 Bergerak (Floating & Glow) */
  .hero-banner::after {
    content: "";
    position: absolute;
    right: 20px;
    top: 50%;
    width: 200px;
    height: 200px;
    background-image: url('logo-hut32.png'); /* Sesuaikan nama file di GitHub */
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.35;
    pointer-events: none;
    animation: floatLogo 4s ease-in-out infinite;
  }

  @keyframes floatLogo {
    0% { transform: translateY(-50%) scale(1); filter: drop-shadow(0 0 0px rgba(245, 158, 11, 0)); }
    50% { transform: translateY(-58%) scale(1.05); filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.5)); }
    100% { transform: translateY(-50%) scale(1); filter: drop-shadow(0 0 0px rgba(245, 158, 11, 0)); }
  }

  .hero-title {
    z-index: 1;
  }

  /* Animasi Shimmer Emas pada Judul Utama */
  .hero-title h1 {
    font-size: 1.85rem;
    font-weight: 800;
    background: linear-gradient(90deg, #ffffff 0%, #fbbf24 25%, #ffffff 50%, #fbbf24 75%, #ffffff 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    animation: textShimmer 5s linear infinite;
  }

  @keyframes textShimmer {
    to { background-position: 200% center; }
  }

  .hero-title p {
    color: var(--text-muted);
    font-size: 0.95rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Pemisah Jam & Tanggal */
  .time-badge {
    z-index: 1;
    background: rgba(21, 13, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    padding: 14px 22px;
    border-radius: 14px;
    text-align: right;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .time-badge .date {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent-gold);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .time-badge .clock {
    font-size: 1.4rem;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  /* Stat Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px 24px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .stat-card:hover {
    transform: translateY(-2px);
    border-color: rgba(245, 158, 11, 0.4);
  }

  .stat-card .title {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .stat-card .value {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent-gold-light);
  }

  /* Search Bar Modern */
  .search-container {
    margin-bottom: 24px;
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 16px 20px 16px 48px;
    border-radius: 14px;
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .search-input::placeholder {
    text-transform: none;
    color: #6b7280;
  }

  .search-input:focus {
    outline: none;
    border-color: var(--accent-gold);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
  }

  .search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 1.1rem;
  }

  /* Table Section */
  .table-wrapper {
    background: var(--bg-card);
    border-radius: 16px;
    border: 1px solid var(--border-color);
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    background: #1c0e3d;
    color: var(--accent-gold);
    padding: 18px 20px;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-bottom: 2px solid var(--border-color);
    user-select: none;
    transition: background 0.2s;
  }

  th:hover {
    background: #2a155c;
  }

  td {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    font-size: 0.95rem;
    text-transform: uppercase;
    font-weight: 500;
  }

  tr:hover td {
    background-color: rgba(139, 92, 246, 0.08);
  }

  tr:last-child td {
    border-bottom: none;
  }

  .empty-state {
    text-align: center;
    padding: 40px !important;
    color: var(--text-muted);
  }

  /* Responsif untuk Mobile */
  @media (max-width: 768px) {
    body { padding: 12px; }
    .video-banner { max-height: 220px; border-radius: 16px; }
    .hero-banner { padding: 24px; }
    .hero-banner::after { width: 130px; height: 130px; opacity: 0.2; }
    .hero-title h1 { font-size: 1.3rem; }
    .table-wrapper { overflow-x: auto; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- Banner Animasi Video Coba Lagi -->
  <video class="video-banner" autoplay loop muted playsinline>
      <source src="coba_lagi.mp4" type="video/mp4">
      Browser Anda tidak mendukung tag video.
  </video>

  <!-- Hero Header Animasi Teks & Jam -->
  <div class="hero-banner">
    <div class="hero-title">
      <h1>Gebyar Hadiah Nikorama Ulang Tahun Ke-32</h1>
      <p>Sistem Pemantauan Data Undian & Doorprize Realtime</p>
    </div>
    
    <!-- Pemisah Jam & Tanggal -->
    <div class="time-badge">
      <div class="date" id="tanggal">-- ------ ----</div>
      <div class="clock" id="jam">--:--:-- WIB</div>
    </div>
  </div>

  <!-- Cards Stat -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="title">Total Peserta / Data</div>
      <div class="value" id="total">0</div>
    </div>
    <div class="stat-card">
      <div class="title">Pembaruan Terakhir</div>
      <div class="value" id="upd" style="font-size: 1.1rem; color: #fff;">-</div>
    </div>
  </div>

  <!-- Search Input -->
  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input id="cari" class="search-input" placeholder="CARI KUPON, NAMA KARYAWAN, DEVISI, DLL...">
  </div>

  <!-- Data Table -->
  <div class="table-wrapper">
    <table id="tbl"></table>
  </div>
</div>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRiZU8-43r2k7yPouq8insGUTXURLnWxC8nOYYNJGLoCkGYLF3YXxrsgR93kRi7Jrnyo-wdenWm91vc/pub?gid=0&single=true&output=csv";
let master=[], sortAsc=true;

function render(data){
  if(!data.length){
    tbl.innerHTML = "<tr><td class='empty-state'>DATA TIDAK DITEMUKAN</td></tr>";
    return;
  }

  const keys = Object.keys(data[0]);
  let h = "<thead><tr>";
  keys.forEach((k) => {
    h += `<th onclick="sortCol('${k}')">${k} ↕</th>`;
  });
  h += "</tr></thead><tbody>";

  data.forEach(r => {
    h += "<tr>";
    Object.values(r).forEach((v) => {
      h += `<td>${v??""}</td>`;
    });
    h += "</tr>";
  });
  
  h += "</tbody>";
  tbl.innerHTML = h;
  total.textContent = data.length.toLocaleString("id-ID");
  upd.textContent = new Date().toLocaleTimeString("id-ID", {hour: '2-digit', minute:'2-digit', second:'2-digit'}) + " WIB";
}

function sortCol(c){
  master.sort((a,b) => sortAsc 
    ? String(a[c]).localeCompare(String(b[c]), 'id', {numeric:true})
    : String(b[c]).localeCompare(String(a[c]), 'id', {numeric:true})
  );
  sortAsc = !sortAsc;
  render(master);
}

function load(){
  Papa.parse(CSV, {
    download: true,
    skipEmptyLines: true,
    complete: r => {
      const rows = r.data;
      if (rows.length < 6) return;
      const header = rows[5].slice(7, 13);
      master = [];
      for(let i = 6; i < rows.length; i++){
         const cols = rows[i].slice(7, 13);
         if(cols.join("").trim() == "") continue;
         let o = {};
         header.forEach((x, j) => o[x] = cols[j] || "");
         master.push(o);
      }
      
      const searchVal = document.getElementById('cari').value.toLowerCase();
      if (searchVal) {
          render(master.filter(x => Object.values(x).join(" ").toLowerCase().includes(searchVal)));
      } else {
          render(master);
      }
    }
  });
}

function updateClock(){
  const now = new Date();
  const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  tanggal.textContent = now.toLocaleDateString("id-ID", optionsDate);
  jam.textContent = now.toLocaleTimeString("id-ID", {hour: '2-digit', minute:'2-digit', second:'2-digit'}) + " WIB";
}

cari.oninput = () => render(master.filter(x => Object.values(x).join(" ").toLowerCase().includes(cari.value.toLowerCase())));

load();
updateClock();

setInterval(load, 10000); // Auto refresh data 10 detik
setInterval(updateClock, 1000);
</script>

</body>
</html>
