<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gebyar Hadiah Nikorama Ulang Tahun Ke-32</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg-primary: #0b132b;
    --bg-card: #1c2541;
    --accent-gold: #f59e0b;
    --accent-gold-light: #fbbf24;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #070d1e;
    color: var(--text-main);
    min-height: 100vh;
    padding: 24px;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
  }

  /* Banner Header Modern */
  .hero-banner {
    background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #0d1b2a 100%);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: 20px;
    padding: 32px 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }

  /* Ornamen Hadiah di Background (Samping Tepi) */
  .hero-banner::after {
    content: "🎁";
    font-size: 160px;
    position: absolute;
    right: -20px;
    top: -30px;
    opacity: 0.12;
    transform: rotate(15deg);
    pointer-events: none;
  }

  .hero-banner::before {
    content: "✨";
    font-size: 80px;
    position: absolute;
    left: 20%;
    bottom: -20px;
    opacity: 0.1;
    pointer-events: none;
  }

  .hero-title h1 {
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(90deg, #ffffff 0%, var(--accent-gold-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .hero-title p {
    color: var(--text-muted);
    font-size: 0.95rem;
    font-weight: 500;
  }

  /* Pemisah Jam & Status */
  .time-badge {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-color);
    padding: 12px 24px;
    border-radius: 12px;
    text-align: right;
  }

  .time-badge .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--accent-gold);
    letter-spacing: 1px;
    font-weight: 700;
  }

  .time-badge .clock {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  /* Stat Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px 24px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .stat-card:hover {
    transform: translateY(-2px);
    border-color: rgba(245, 158, 11, 0.4);
  }

  .stat-card .title {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .stat-card .value {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent-gold-light);
  }

  /* Search Bar Modern */
  .search-container {
    margin-bottom: 24px;
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 16px 20px 16px 48px;
    border-radius: 14px;
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
  }

  .search-input:focus {
    outline: none;
    border-color: var(--accent-gold);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
  }

  .search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 1.1rem;
  }

  /* Table Section */
  .table-wrapper {
    background: var(--bg-card);
    border-radius: 16px;
    border: 1px solid var(--border-color);
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    background: #141c33;
    color: var(--accent-gold);
    padding: 16px 20px;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-bottom: 2px solid var(--border-color);
    user-select: none;
    transition: background 0.2s;
  }

  th:hover {
    background: #1e2942;
  }

  td {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    font-size: 0.95rem;
  }

  tr:hover td {
    background-color: rgba(255, 255, 255, 0.02);
  }

  tr:last-child td {
    border-bottom: none;
  }

  .empty-state {
    text-align: center;
    padding: 40px !important;
    color: var(--text-muted);
  }

  @media (max-width: 768px) {
    body { padding: 12px; }
    .hero-banner { padding: 20px; }
    .hero-title h1 { font-size: 1.3rem; }
    .table-wrapper { overflow-x: auto; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Hero Header -->
  <div class="hero-banner">
    <div class="hero-title">
      <h1>Gebyar Hadiah Nikorama Ulang Tahun Ke-32</h1>
      <p>Sistem Pemantauan Data Undian & Doorprize Realtime</p>
    </div>
    
    <!-- Pemisah Jam -->
    <div class="time-badge">
      <div class="label">Waktu Sistem</div>
      <div class="clock" id="jam">--:--:--</div>
    </div>
  </div>

  <!-- Cards Stat -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="title">Total Peserta / Data</div>
      <div class="value" id="total">0</div>
    </div>
    <div class="stat-card">
      <div class="title">Pembaruan Terakhir</div>
      <div class="value" id="upd" style="font-size: 1.1rem; color: #fff;">-</div>
    </div>
  </div>

  <!-- Search Input -->
  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input id="cari" class="search-input" placeholder="Cari data peserta, kupon, atau kata kunci...">
  </div>

  <!-- Data Table -->
  <div class="table-wrapper">
    <table id="tbl"></table>
  </div>
</div>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRiZU8-43r2k7yPouq8insGUTXURLnWxC8nOYYNJGLoCkGYLF3YXxrsgR93kRi7Jrnyo-wdenWm91vc/pub?gid=0&single=true&output=csv";
let master=[], sortAsc=true;

function render(data){
  if(!data.length){
    tbl.innerHTML = "<tr><td class='empty-state'>Data tidak ditemukan</td></tr>";
    return;
  }
  let h = "<thead><tr>";
  Object.keys(data[0]).forEach(k => h += `<th onclick="sortCol('${k}')">${k} ↕</th>`);
  h += "</tr></thead><tbody>";
  data.forEach(r => {
    h += "<tr>";
    Object.values(r).forEach(v => h += `<td>${v??""}</td>`);
    h += "</tr>";
  });
  h += "</tbody>";
  tbl.innerHTML = h;
  total.textContent = data.length.toLocaleString("id-ID");
  upd.textContent = new Date().toLocaleTimeString("id-ID", {hour: '2-digit', minute:'2-digit', second:'2-digit'}) + " WIB";
}

function sortCol(c){
  master.sort((a,b) => sortAsc 
    ? String(a[c]).localeCompare(String(b[c]), 'id', {numeric:true})
    : String(b[c]).localeCompare(String(a[c]), 'id', {numeric:true})
  );
  sortAsc = !sortAsc;
  render(master);
}

function load(){
  Papa.parse(CSV, {
    download: true,
    skipEmptyLines: true,
    complete: r => {
      const rows = r.data;
      const header = rows[5].slice(7, 13);
      master = [];
      for(let i = 6; i < rows.length; i++){
         const cols = rows[i].slice(7, 13);
         if(cols.join("").trim() == "") continue;
         let o = {};
         header.forEach((x, j) => o[x] = cols[j] || "");
         master.push(o);
      }
      render(master);
    }
  });
}

cari.oninput = () => render(master.filter(x => Object.values(x).join(" ").toLowerCase().includes(cari.value.toLowerCase())));

load();
setInterval(load, 10000);
setInterval(() => jam.textContent = new Date().toLocaleTimeString("id-ID"), 1000);
</script>

</body>
</html>
