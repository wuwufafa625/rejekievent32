<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Doorprize</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#6a11cb,#2575fc,#00c6ff);
    min-height:100vh;
    padding:40px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
    margin-bottom:30px;
}

.title{
    font-size:34px;
    font-weight:700;
}

.clock{
    font-size:20px;
    font-weight:600;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    border-radius:18px;
    color:#fff;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.card h3{
    font-size:15px;
    opacity:.8;
}

.card h1{
    font-size:40px;
    margin-top:10px;
}

.table-box{
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

table{
    width:100%!important;
}

thead{
    background:#2575fc;
    color:#fff;
}

tbody tr:hover{
    background:#eef5ff!important;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="title">
            <i class="fa-solid fa-gift"></i>
            Dashboard Doorprize
        </div>

        <div id="jam" class="clock"></div>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Peserta</h3>
            <h1 id="total">0</h1>
        </div>

        <div class="card">
            <h3>Status</h3>
            <h1>Online</h1>
        </div>

        <div class="card">
            <h3>Last Update</h3>
            <h1 id="tgl">-</h1>
        </div>

    </div>

    <div class="table-box">
        <table id="tbl" class="display nowrap"></table>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

const csv =
"https://docs.google.com/spreadsheets/d/1rPoe-fdWCybtecZrF8_nmdFYEj225tJ0y-jcHYD8NQw/gviz/tq?tqx=out:csv&sheet=NCT_LIST%20DOORPRIZE&range=H6:M213";

async function load(){

    const txt = await fetch(CSV_URL + "?t=" + Date.now()).then(r=>r.text());

    const rows = parseCSV(txt);

    // Header H:M
    const header = rows[5].slice(7,13);

    master=[];

    for(let i=6;i<rows.length;i++){

        const r = rows[i];

        // hanya H:M
        const cols = r.slice(7,13);

        if(cols.join("").trim()=="") continue;

        let obj={};

        header.forEach((h,j)=>{
            obj[h]=cols[j]||"";
        });

        master.push(obj);

    }

    render(master);

    document.getElementById("total").textContent=master.length;
    document.getElementById("update").textContent=new Date().toLocaleString("id-ID");
}

load();

// refresh data setiap 30 detik
setInterval(load,30000);

// jam realtime
setInterval(function(){

    document.getElementById("jam").innerHTML=
        new Date().toLocaleTimeString("id-ID");

},1000);

</script>

</body>
</html>
