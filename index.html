<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Doorprize</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#4f46e5,#06b6d4);
padding:30px;
min-height:100vh;
}

.container{
max-width:1500px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
color:#fff;
flex-wrap:wrap;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
padding:20px;
border-radius:15px;
color:white;
}

.card h1{
margin-top:10px;
font-size:40px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
margin-bottom:20px;
font-size:16px;
}

.table-wrap{
overflow:auto;
background:white;
border-radius:15px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#2563eb;
color:white;
padding:12px;
position:sticky;
top:0;
cursor:pointer;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#eef5ff;
}

#loading{
color:white;
margin-bottom:15px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🎁 Dashboard Doorprize</h1>
<h2 id="clock"></h2>
</div>

<div class="cards">

<div class="card">
<h3>Total Peserta</h3>
<h1 id="total">0</h1>
</div>

<div class="card">
<h3>Status</h3>
<h1>ONLINE</h1>
</div>

<div class="card">
<h3>Update</h3>
<h2 id="update">-</h2>
</div>

</div>

<div id="loading">Memuat data...</div>

<input id="search" placeholder="Cari data...">

<div class="table-wrap">
<table id="tbl"></table>
</div>

</div>

<script>

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRiZU8-43r2k7yPouq8insGUTXURLnWxC8nOYYNJGLoCkGYLF3YXxrsgR93kRi7Jrnyo-wdenWm91vc/pub?gid=0&single=true&output=csv";

let master=[];
let asc=true;

function parseCSV(text){

const rows=[];
let row=[];
let value="";
let quote=false;

for(let i=0;i<text.length;i++){

const c=text[i];

if(c=='"'){

quote=!quote;

}else if(c=="," && !quote){

row.push(value);
value="";

}else if((c=="\n" || c=="\r") && !quote){

if(value!==""||row.length){

row.push(value);
rows.push(row);

row=[];
value="";

}

}else{

value+=c;

}

}

if(value!==""||row.length){

row.push(value);
rows.push(row);

}

return rows;

}

async function load(){

document.getElementById("loading").innerHTML="Mengambil data...";

const txt=await fetch(CSV_URL+"?t="+Date.now()).then(r=>r.text());

const rows=parseCSV(txt);

const header=rows[5].slice(7,13);

master=[];

for(let i=6;i<rows.length;i++){

const r=rows[i];

if(r.slice(7,13).join("").trim()=="") continue;

let obj={};

header.forEach((h,j)=>{

obj[h]=r[j+7]||"";

});

master.push(obj);

}

render(master);

document.getElementById("total").innerHTML=master.length;
document.getElementById("update").innerHTML=new Date().toLocaleString("id-ID");
document.getElementById("loading").innerHTML="";

}

function render(data){

const tbl=document.getElementById("tbl");

let html="<thead><tr>";

Object.keys(data[0]).forEach(h=>{

html+="<th onclick='sortTable(\""+h+"\")'>"+h+"</th>";

});

html+="</tr></thead><tbody>";

data.forEach(r=>{

html+="<tr>";

Object.values(r).forEach(v=>{

html+="<td>"+v+"</td>";

});

html+="</tr>";

});

html+="</tbody>";

tbl.innerHTML=html;

}

function sortTable(col){

master.sort((a,b)=>{

return asc
?String(a[col]).localeCompare(String(b[col]),'id',{numeric:true})
:String(b[col]).localeCompare(String(a[col]),'id',{numeric:true});

});

asc=!asc;

render(master);

}

document.getElementById("search").addEventListener("input",function(){

const s=this.value.toLowerCase();

render(

master.filter(x=>

Object.values(x)

.join(" ")

.toLowerCase()

.includes(s)

)

);

});

load();

setInterval(load,30000);

setInterval(()=>{

document.getElementById("clock").innerHTML=new Date().toLocaleTimeString("id-ID");

},1000);

</script>

</body>
</html>
